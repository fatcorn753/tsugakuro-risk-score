<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}通学路 危険区間スコアリング（市川市）{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: "Hiragino Sans", "Noto Sans CJK JP", sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #fafafa; color: #222; }
    header { border-bottom: 3px solid #2b6cb0; padding-bottom: 10px; margin-bottom: 16px; }
    header h1 { color: #2b6cb0; margin: 0 0 4px; font-size: 1.3em; }
    .note { color: #666; font-size: 0.85em; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
    #map { height: 480px; border-radius: 8px; border: 1px solid #ccc; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82em; color: #555; margin: 8px 0 0; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 18px; height: 4px; display: inline-block; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9em; min-width: 640px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #f0f4f8; }
    tr.rank-high td { background: #fdeeee; }
    tr.rank-mid td { background: #fff9ec; }
    .summary-grid { display: flex; gap: 24px; flex-wrap: wrap; }
    .summary-grid div { min-width: 120px; }
    .summary-grid .num { font-size: 1.5em; font-weight: bold; color: #2b6cb0; }
  </style>
</head>
<body>
  <header>
    <h1>通学路 危険区間スコアリング（市川市）</h1>
    <p class="note">市川市オープンデータ「小学校通学ルート」× 警察庁オープンデータ「交通事故統計情報」を突き合わせて算出</p>
  </header>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
